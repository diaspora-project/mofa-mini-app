services:

  mofa:
    build:
      context: .
      dockerfile: Dockerfile-octopus2
    container_name: octopus2
    env_file:
      - secrets.env
    environment:
       - LAUNCH_OPTION=both
       - QUEUE_TYPE=octopus
       - REDIS_HOST=redis-service
    deploy:
      resources:
        limits:
          memory: 24g
    depends_on:
      - redis-service

  redis-service:
    image: redis:latest
    container_name: redis-service
    ports:
      - "6379:6379"
