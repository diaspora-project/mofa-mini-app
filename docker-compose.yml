networks:
  shared-net:
    driver: bridge
volumes:
  mofa:
services:
  taskserver:
    image: mofa-app
    platform: linux/amd64
    environment:
      - OCTOPUS_LAUNCH_OPTION=server
    env_file:
      - .env
    networks:
      - shared-net
    volumes:
      - mofa:/mnt/mofa
    depends_on:
      bedrock:
        condition: service_healthy
        restart: true
    deploy:
      resources:
        limits:
          memory: 24g

  thinker:
    image: mofa-app
    platform: linux/amd64
    environment:
      - OCTOPUS_LAUNCH_OPTION=thinker
    env_file:
      - .env
    volumes:
      - mofa:/mnt/mofa
    networks:
      - shared-net
    depends_on:
      bedrock:
        condition: service_healthy
        restart: true
    deploy:
      resources:
        limits:
          memory: 24g
  bedrock:
    image: mofa-app
    platform: linux/amd64
    volumes:
      - mofa:/mnt/mofa
      - $PWD:/mofa
    env_file:
      - .env
    networks:
      - shared-net
    entrypoint:
      - conda #./launch_mofka.sh
    command:
      - run
      - --no-capture-output
      - -n
      - mofa
      - /bin/bash
      - /mofa/launch_mofka.sh #"/mofa/launch_mofka.sh"
    healthcheck:
      test: ["CMD-SHELL", "ls /mnt/mofa/mofka.json"]
      interval: 5s
      retries: 3
      start_period: 5s
      timeout: 1s
