services:

  mofa:
    build:
      context: .
      dockerfile: Dockerfile-octopus2
    container_name: octopus2
    env_file:
      - secrets.env
    environment:
       - LAUNCH_OPTION=both
       - QUEUE_TYPE=octopus
    deploy:
      resources:
        limits:
          memory: 24g
    depends_on:
      - redis-service
    stdin_open: true
    tty: true

  redis-service:
    image: redis:latest
    container_name: redis-service
    ports:
      - "6379:6379"
