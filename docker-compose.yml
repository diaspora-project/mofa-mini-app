services:

  thinker:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: thinker
    env_file:
      - secrets.env
    environment:
       - LAUNCH_OPTION=thinker
       - QUEUE_TYPE=octopus
       - REDIS_HOST=redis-service
       - MONGO_HOST=localhost
       - PROXYSTORE_ENDPOINT_NAME=ep18765
       - PROXYSTORE_ENDPOINT_PORT=18765
    ports:
      - "27018:27017"
    deploy:
      resources:
        limits:
          memory: 24g
    depends_on:
      - redis-service

  server:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: server
    env_file:
      - secrets.env
    environment:
       - LAUNCH_OPTION=server
       - QUEUE_TYPE=octopus
       - REDIS_HOST=redis-service
       - MONGO_HOST=thinker
       - PROXYSTORE_ENDPOINT_NAME=ep18766
       - PROXYSTORE_ENDPOINT_PORT=18766
    deploy:
      resources:
        limits:
          memory: 24g
    depends_on:
      - redis-service

  redis-service:
    image: redis:latest
    container_name: redis-service
    ports:
      - "6380:6379"
