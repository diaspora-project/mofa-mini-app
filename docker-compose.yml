services:
  taskserver:
    image: mofa-app
    platform: linux/amd64
    environment:
      - OCTOPUS_LAUNCH_OPTION=server
      - OCTOPUS_AWS_ACCESS_KEY_ID=${OCTOPUS_AWS_ACCESS_KEY_ID}
      - OCTOPUS_AWS_SECRET_ACCESS_KEY=${OCTOPUS_AWS_SECRET_ACCESS_KEY}
      - OCTOPUS_BOOTSTRAP_SERVERS=${OCTOPUS_BOOTSTRAP_SERVERS}
      - PROXYSTORE_GLOBUS_CLIENT_ID=${PROXYSTORE_GLOBUS_CLIENT_ID}
      - PROXYSTORE_GLOBUS_CLIENT_SECRET=${PROXYSTORE_GLOBUS_CLIENT_SECRET}
      - PROXYSTORE_ENDPOINT_PORT=8765
    deploy:
      resources:
        limits:
          memory: 24g

  thinker:
    image: mofa-app
    platform: linux/amd64
    environment:
      - OCTOPUS_LAUNCH_OPTION=thinker
      - OCTOPUS_AWS_ACCESS_KEY_ID=${OCTOPUS_AWS_ACCESS_KEY_ID}
      - OCTOPUS_AWS_SECRET_ACCESS_KEY=${OCTOPUS_AWS_SECRET_ACCESS_KEY}
      - OCTOPUS_BOOTSTRAP_SERVERS=${OCTOPUS_BOOTSTRAP_SERVERS}
      - PROXYSTORE_GLOBUS_CLIENT_ID=${PROXYSTORE_GLOBUS_CLIENT_ID}
      - PROXYSTORE_GLOBUS_CLIENT_SECRET=${PROXYSTORE_GLOBUS_CLIENT_SECRET}
      - PROXYSTORE_ENDPOINT_PORT=8764
    deploy:
      resources:
        limits:
          memory: 24g
